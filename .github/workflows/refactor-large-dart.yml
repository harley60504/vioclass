name: Refactor large Dart modules

on:
  push:
    branches:
      - ai/refactor-large-dart

permissions:
  contents: write

concurrency:
  group: refactor-large-dart
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-output]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ai/refactor-large-dart
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Split large Dart modules
        run: |
          python3 tool/refactor_large_dart.py
          python3 tool/refactor_large_dart_fix.py

      - name: Format refactor only
        shell: bash
        run: |
          dart format \
            lib/features/twitch/services/playback/twitch_hls_low_latency_proxy.dart \
            lib/features/twitch/services/playback/twitch_hls_low_latency_proxy_parts \
            lib/features/twitch/presentation/pages/twitch_drops_connection_page.dart \
            lib/features/twitch/presentation/pages/twitch_drops_connection_page_parts \
            lib/features/twitch/presentation/pages/twitch_channel_page.dart \
            lib/features/twitch/presentation/pages/twitch_channel_page_parts \
            lib/features/twitch/services/playback/twitch_playlist_player_runtime.dart \
            lib/features/twitch/services/playback/twitch_playlist_player_runtime_parts \
            lib/features/twitch/presentation/pages/twitch_stream_page.dart \
            lib/features/twitch/presentation/pages/twitch_stream_page_parts \
            lib/features/twitch/services/chat/twitch_chat_runtime.dart \
            lib/features/twitch/services/chat/twitch_chat_runtime_parts

      - name: Resolve dependencies
        run: flutter pub get

      - name: Print DVR extension diagnostics
        shell: bash
        run: |
          file=lib/features/twitch/services/playback/twitch_playlist_player_runtime_parts/04_twitch_playlist_player_runtime_dvr_ops.dart
          nl -ba "$file" | sed -n '355,395p;495,512p'

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Remove one-off refactor tooling
        run: |
          rm -f tool/refactor_large_dart.py
          rm -f tool/refactor_large_dart_fix.py
          rm -f .github/workflows/refactor-large-dart.yml

      - name: Commit refactor output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: split large twitch modules [refactor-output]'
          git push origin HEAD:ai/refactor-large-dart
