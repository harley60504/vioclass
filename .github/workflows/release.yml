name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.1.9'
        required: true
        type: string
      notes:
        description: 'Optional release notes. Leave blank to auto-generate from commits.'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      build_number: ${{ steps.meta.outputs.build_number }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and build number
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "Manual releases must be dispatched from main." >&2
              exit 1
            fi
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format, got: ${version}" >&2
            exit 1
          fi

          base_build="$(sed -nE 's/^version:[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ -z "${base_build}" ]]; then
            echo "Could not read build number from pubspec.yaml." >&2
            exit 1
          fi

          build_number=$((base_build + GITHUB_RUN_NUMBER))

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Apply release version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          value = f"version: {os.environ['VERSION']}+{os.environ['BUILD_NUMBER']}"
          updated, count = re.subn(r'(?m)^version:\s*.*$', value, text, count=1)
          if count != 1:
              raise SystemExit('Could not update pubspec version')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "VioClass-${VERSION}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: VioClass-${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows ZIP
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter version
        shell: pwsh
        run: |
          flutter --version
          flutter config --enable-windows-desktop

      - name: Apply release version
        shell: pwsh
        run: |
          $path = Resolve-Path 'pubspec.yaml'
          $text = [IO.File]::ReadAllText($path)
          $replacement = "version: $env:VERSION+$env:BUILD_NUMBER"
          $updated = [regex]::Replace($text, '(?m)^version:\s*.*$', $replacement, 1)
          if ($updated -eq $text) {
            throw 'Could not update pubspec version'
          }
          [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory not found: $releaseDir"
          }
          $zip = "VioClass-$env:VERSION-windows.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: VioClass-${{ needs.prepare.outputs.version }}-windows.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - android
      - windows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/VioClass-${VERSION}.apk"
          test -f "dist/VioClass-${VERSION}-windows.zip"
          ls -lh dist

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            exit 0
          fi

          if [[ -n "${RELEASE_NOTES}" ]]; then
            printf '%s\n' "${RELEASE_NOTES}" > release-notes.md
            gh release create "${TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${TARGET_SHA}" \
              --title "VioClass ${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${TARGET_SHA}" \
              --title "VioClass ${VERSION}" \
              --generate-notes
          fi
